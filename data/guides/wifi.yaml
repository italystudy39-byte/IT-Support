id: wifi_meeting_room
title: Не подключается Wi‑Fi в офисе/переговорной
description: Ноутбук или телефон не подключается к офисному Wi‑Fi, нет интернета в переговорной.
keywords: [wifi, вайфай, интернет, переговорная]
needs: [os]
category: network_vpn
priority: high
variants:
  windows:
    - "Выключите и снова включите Wi‑Fi: значок сети у часов → кнопка Wi‑Fi."
    - "Подключитесь к сети `Corp-WiFi` и войдите с рабочим логином `имя.фамилия` и паролем. Если сеть «запомнилась» со старым паролем: правой кнопкой по сети → **Забыть**, затем подключитесь заново."
    - "Если срочно нужен интернет на встречу — временно подключитесь к гостевой сети `Corp-Guest` (пароль висит на стене в переговорной) или раздайте интернет с телефона."
  macos:
    - "Выключите и снова включите Wi‑Fi в строке меню."
    - "Подключитесь к `Corp-WiFi` с логином `имя.фамилия` и паролем. Если сеть сохранена со старым паролем: **Системные настройки → Wi‑Fi → (…) у сети → Забыть эту сеть**, затем подключитесь заново."
    - "Если срочно нужен интернет на встречу — временно подключитесь к `Corp-Guest` (пароль на стене переговорной) или раздайте интернет с телефона."
