id: printer_connect
title: Подключение принтера
description: Как подключить офисный принтер или МФУ на своём этаже; принтер не печатает.
keywords: [принтер, печать, мфу, сканер]
needs: [os, office]
category: printer
priority: low
variants:
  windows:
    - "Убедитесь, что вы подключены к **офисному** Wi‑Fi `Corp-WiFi` (не гостевому) или к сети по кабелю. С гостевой сети принтеры не видны."
    - "Откройте **Пуск → Параметры → Bluetooth и устройства → Принтеры и сканеры → Добавить устройство**."
    - "Подождите 10–20 секунд. Выберите принтер своего этажа — они названы по схеме `PRN-<офис>-<этаж>`, например `PRN-MSK-3`. Если его нет в списке — нажмите «Добавить вручную» и введите `\\\\print.corp.local\\PRN-MSK-3` (подставьте свой офис и этаж)."
    - "Отправьте тестовую страницу: выберите принтер → **Печать пробной страницы**."
  macos:
    - "Убедитесь, что вы подключены к **офисному** Wi‑Fi `Corp-WiFi` (не гостевому). С гостевой сети принтеры не видны."
    - "Откройте **Системные настройки → Принтеры и сканеры → Добавить принтер, сканер или факс**."
    - "Выберите принтер своего этажа — они названы `PRN-<офис>-<этаж>`, например `PRN-MSK-3`. В поле «Использовать» оставьте «AirPrint» или «Secure AirPrint» и нажмите «Добавить»."
    - "Попробуйте напечатать любую страницу (Cmd+P в любом документе)."
