id: password_reset
title: Сброс пароля от рабочей учётной записи
description: Забыл пароль от корпоративной почты/компьютера/учётки, учётная запись заблокирована, истёк срок пароля.
keywords: [пароль, забыл, заблокирован, учётка, почта]
needs: []
category: account_access
priority: medium
variants:
  any:
    - "Откройте портал самообслуживания **https://passwd.corp.example** с телефона или любого устройства с интернетом. (Пароль никому не сообщайте — ни боту, ни коллегам, ни IT.)"
    - "Нажмите **«Забыли пароль?»** и введите рабочий логин в формате `имя.фамилия`."
    - "Подтвердите личность кодом из SMS на рабочий номер или из приложения‑аутентификатора."
    - "Придумайте новый пароль: не короче 12 символов, буквы разного регистра и цифры, не совпадает с последними 5 паролями."
    - "Подождите 2–3 минуты и войдите с новым паролем. На телефоне в почте тоже нужно будет ввести новый пароль."
