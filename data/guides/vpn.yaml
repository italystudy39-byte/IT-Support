id: vpn_not_working
title: Не работает VPN
description: VPN не подключается, подключается и сразу отваливается, или после подключения не открываются внутренние ресурсы.
keywords: [vpn, впн, удалёнка, не подключается]
needs: [os]
category: network_vpn
priority: medium
variants:
  windows:
    - "Проверьте, что обычный интернет работает: откройте любой сайт, например ya.ru. Если сайты не открываются — проблема не в VPN, а в интернете (Wi‑Fi/роутер)."
    - "Полностью закройте VPN-клиент: правой кнопкой по значку у часов → **Выход** (Quit). Затем запустите его снова из меню «Пуск»."
    - "Проверьте дату и время на компьютере (правый нижний угол). Если они неверные — **Параметры → Время и язык → Синхронизировать сейчас**. Из‑за неверного времени VPN не принимает сертификат."
    - "Подключитесь заново и введите логин в формате `имя.фамилия` и **текущий** пароль от рабочей учётной записи. Если недавно меняли пароль — используйте новый."
    - "Перезагрузите компьютер и попробуйте подключиться ещё раз."
  macos:
    - "Проверьте, что обычный интернет работает: откройте любой сайт, например ya.ru. Если сайты не открываются — проблема в Wi‑Fi/роутере, а не в VPN."
    - "Закройте VPN-клиент полностью: значок в строке меню → **Quit** (или Cmd+Q в окне клиента). Затем откройте его снова из Launchpad."
    - "Проверьте **Системные настройки → Основные → Дата и время**: включено «Устанавливать автоматически». Неверное время ломает проверку сертификата."
    - "Подключитесь заново: логин `имя.фамилия`, **текущий** пароль от рабочей учётки. Если macOS спросит разрешение на добавление VPN-конфигурации — нажмите «Разрешить»."
    - "Перезагрузите Mac и попробуйте снова."
