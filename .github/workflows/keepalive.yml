# Будит бесплатный сервис Render, чтобы он не засыпал (Render засыпает через 15 минут без внешних запросов)
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS -m 90 --retry 2 -o /dev/null -w "%{http_code} %{time_total}s\n" https://it-support-xgrt.onrender.com/health
